name: Monitorear cambios en el bloc

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: write  # Para poder guardar el archivo de estado

jobs:
  monitoreo:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Obtener estado actual del Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Crear carpeta para estado si no existe
          mkdir -p .estado
          
          # Obtener última fecha de modificación del Gist
          curl -s -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/gists/$GIST_ID | \
            jq -r '.updated_at' > .estado/ultima_fecha_gist.txt

      - name: Leer fecha anterior (si existe)
        id: comparar
        run: |
          if [ -f .estado/fecha_anterior.txt ]; then
            ANTERIOR=$(cat .estado/fecha_anterior.txt)
            ACTUAL=$(cat .estado/ultima_fecha_gist.txt)
            if [ "$ANTERIOR" != "$ACTUAL" ]; then
              echo "cambiado=true" >> $GITHUB_OUTPUT
              echo "📢 El Gist ha cambiado"
            else
              echo "cambiado=false" >> $GITHUB_OUTPUT
              echo "✅ Sin cambios"
            fi
          else
            echo "cambiado=true" >> $GITHUB_OUTPUT
            echo "📢 Primera ejecución"
          fi

      - name: Crear issue de notificación
        if: steps.comparar.outputs.cambiado == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📝 Nueva nota en el bloc',
              body: `## Se ha detectado una nueva nota

**📅 Fecha:** ${new Date().toLocaleString()}
**🔗 Ver cambios:** https://gist.github.com/${{ secrets.GIST_ID }}

---
*Este aviso se genera automáticamente.*
`,
              labels: ['bloc-notas']
            });

      - name: Guardar fecha actual como "anterior"
        run: |
          cp .estado/ultima_fecha_gist.txt .estado/fecha_anterior.txt

      - name: Subir archivos de estado al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado del monitoreo"
          file_pattern: ".estado/*"
