name: Enviar notificaciones por correo - PRUEBA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar correo directamente
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📝 Nueva nota en el bloc"
          to: ${{ secrets.MAIL_USERNAME }}
          from: Bloc Notas <${{ secrets.MAIL_USERNAME }}>
          body: |
            Alguien ha actualizado las notas del bloc.
            Revisa: ${{ github.event.repository.html_url }}
