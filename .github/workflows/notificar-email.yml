name: Notificar a tu equipo sobre cambios en tu Bloc de Notas

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Crear aviso en GitHub
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📝 Notificar a tu equipo sobre cambios en tu Bloc de Notas`,
              body: `## Se ha detectado una nueva nota en el bloc.

**Autor:** ${{ github.actor }}
**Repositorio:** ${context.repo.owner}/${context.repo.repo}
**Fecha:** ${new Date().toLocaleString()}

🔗 [Ver cambios en GitHub](${{ github.event.repository.html_url }}/commit/${{ github.sha }})

---
*Este aviso se genera automáticamente.*`,
              labels: ['bloc-notas', 'automatico']
            });
