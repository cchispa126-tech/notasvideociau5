name: Enviar notificaciones por correo

on:
  push:
    branches: [ main, master ]

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener emails del Gist
        id: emails
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EMAILS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/gists/$GIST_ID | \
            jq -r '.files["emails.json"].content // "[]"' | \
            jq -r 'join(",")')
          echo "to=$EMAILS" >> $GITHUB_OUTPUT
          echo "📧 Correos: $EMAILS"

      - name: Enviar correo
        if: steps.emails.outputs.to != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 📝 Nueva nota en el bloc
          to: ${{ steps.emails.outputs.to }}
          from: Bloc Notas <${{ secrets.MAIL_USERNAME }}>
          body: |
            Alguien ha actualizado las notas del bloc.
            
            Revisa los cambios en:
            https://cchispa126-tech.github.io/
            
