name: Enviar notificaciones por correo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar horario
        id: horario
        run: |
          export TZ='Europe/Madrid'
          HORA=$(date +%H)
          echo "⏰ Hora actual: ${HORA}:00"
          
          if [ $HORA -ge 23 ] || [ $HORA -lt 7 ]; then
            echo "es_nocturno=true" >> $GITHUB_OUTPUT
            echo "🔕 Horario nocturno. No se enviarán notificaciones."
          else
            echo "es_nocturno=false" >> $GITHUB_OUTPUT
            echo "🔔 Horario diurno. Enviando notificaciones..."
          fi
          
      - name: Enviar correo a la cuenta con 2FA
        if: steps.horario.outputs.es_nocturno == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📝 Nueva nota en el bloc"
          to: ${{ secrets.MAIL_USERNAME }}
          from: Bloc Notas <${{ secrets.MAIL_USERNAME }}>
          body: |
            📝 NUEVA NOTA EN EL BLOC
            
            Alguien ha actualizado las notas del bloc.
            
            📂 Repositorio: ${{ github.repository }}
            👤 Autor: ${{ github.event.head_commit.author.name }}
            📅 Fecha: ${{ github.event.head_commit.timestamp }}
            
            🔗 Ver los cambios:
            ${{ github.event.repository.html_url }}
            
            ---
            Este es un mensaje automático de GitHub Actions.
